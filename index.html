<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biosolids Dataset Inventory</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f2eb;
      --ink:       #1c1a16;
      --accent:    #3a6b4a;
      --accent-lt: #d4e8da;
      --muted:     #7a7163;
      --border:    #d0c9bc;
      --card:      #fffdf8;
      --highlight: #3a6b4a;
      --no-data:   #ddd9d0;
      --hover:     #2d5239;
      --selected:  #1e3a27;
    }

    html, body {
      height: 100%;
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--ink);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      padding: 1.1rem 2rem;
      border-bottom: 1.5px solid var(--border);
      background: var(--card);
    }
    header h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    header .subtitle {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .legend-pill {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .legend-pill span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      display: inline-block;
    }
    .dot.has { background: var(--accent); }
    .dot.none { background: var(--no-data); border: 1px solid var(--border); }

    /* ── Layout ── */
    .layout {
      display: flex;
      height: calc(100vh - 56px);
    }

    /* ── Map ── */
    #map {
      flex: 1;
      position: relative;
    }

    /* ── Sidebar / Info panel ── */
    #info-panel {
      width: 380px;
      min-width: 320px;
      background: var(--card);
      border-left: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .panel-header {
      padding: 1.2rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .panel-header .state-name {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .panel-header .panel-hint {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem 1.5rem;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 0.8rem;
      color: var(--muted);
    }
    .empty-state .icon {
      font-size: 2.5rem;
      opacity: 0.4;
    }
    .empty-state p {
      font-size: 0.78rem;
      line-height: 1.7;
      max-width: 220px;
      letter-spacing: 0.02em;
    }

    /* No-data state */
    .no-data-state {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-top: 0.5rem;
    }
    .no-data-state p {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.7;
    }

    /* Dataset count badge */
    .dataset-count {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent-lt);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-top: 0.3rem;
      margin-bottom: 0.8rem;
    }

    /* Dataset cards */
    .dataset-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 1rem;
      overflow: hidden;
      background: var(--bg);
    }
    .dataset-card + .dataset-card {
      margin-top: 0;
    }

    .card-section {
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
    }
    .card-section:last-child { border-bottom: none; }

    .card-title {
      font-family: 'Libre Baskerville', serif;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.2rem;
    }
    .card-provider {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .card-desc {
      font-size: 0.75rem;
      line-height: 1.65;
      color: #3d3a33;
    }

    /* Field rows */
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 0.8rem;
      padding: 0.75rem 1rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .field.full { grid-column: 1 / -1; }
    .field-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field-value {
      font-size: 0.75rem;
      color: var(--ink);
      line-height: 1.4;
    }
    .tag {
      display: inline-block;
      background: var(--accent-lt);
      color: var(--accent);
      font-size: 0.65rem;
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      letter-spacing: 0.04em;
      margin: 0.1rem 0.1rem 0 0;
    }

    /* Note */
    .access-note {
      font-size: 0.72rem;
      background: #fff8e7;
      border-left: 3px solid #d4a017;
      padding: 0.5rem 0.75rem;
      color: #6b520a;
      line-height: 1.6;
      border-radius: 0 4px 4px 0;
    }

    /* Links */
    .link-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      padding: 0.7rem 1rem;
    }
    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--ink);
      background: var(--card);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-link:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-link.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-link.primary:hover { background: var(--hover); border-color: var(--hover); }

    /* Leaflet overrides */
    .leaflet-container { background: #e8e4dc; }
    .leaflet-control-zoom a {
      font-family: 'DM Mono', monospace;
      color: var(--ink) !important;
      background: var(--card) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: var(--accent-lt) !important; }
    .leaflet-control-attribution {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem !important;
      background: rgba(255,253,248,0.85) !important;
    }

    /* Scrollbar */
    .panel-body::-webkit-scrollbar { width: 5px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Mobile */
    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      #info-panel { width: 100%; height: 50vh; border-left: none; border-top: 1.5px solid var(--border); }
      .legend-pill { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>Biosolids Dataset Inventory</h1>
  <span class="subtitle">United States</span>
  <div class="legend-pill">
    <span><i class="dot has"></i> Dataset available</span>
    <span><i class="dot none"></i> No data</span>
  </div>
</header>

<div class="layout">
  <div id="map"></div>
  <div id="info-panel">
    <div class="panel-header">
      <div class="state-name" id="panel-state-name">Select a state</div>
      <div class="panel-hint" id="panel-hint">Click any highlighted state to view dataset info</div>
    </div>
    <div class="panel-body" id="panel-body">
      <div class="empty-state">
        <div class="icon">🗺</div>
        <p>States with available biosolids datasets are highlighted in green. Click one to explore.</p>
      </div>
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="map.js"></script>
</body>
</html>
